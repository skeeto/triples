plugins {
    id 'com.android.application'
}

android {
    namespace      "com.nullprogram.triples"
    compileSdkVersion 35
    // Pinned to the version Homebrew's android-ndk cask currently ships.
    // AGP defaults to an older version it expects in the SDK's ndk/ subdir;
    // without this pin AGP rejects the brew-installed NDK as "wrong version".
    // Bump if `brew upgrade android-ndk` lands a newer revision (see
    // /opt/homebrew/share/android-ndk/source.properties).
    ndkVersion "29.0.14206865"
    defaultConfig {
        applicationId  "com.nullprogram.triples"
        minSdkVersion    21
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-21",
                          "-DANDROID_STL=c++_static"
                // arm64-v8a covers every modern phone; x86_64 lets the same
                // APK run on the (arm64-host) Android Studio simulator when
                // a phone isn't plugged in.
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                          'proguard-rules.pro'
        }
    }
    // Gradle drives our root CMakeLists.txt directly — no per-app jni/
    // CMakeLists.txt indirection. Our CMakeLists has an `if(ANDROID)`
    // branch that builds `libtriples.so` as a SHARED library plus a
    // shared `libSDL3.so` alongside it.
    //
    // AGP's default CMake (3.22.1) is older than our cmake_minimum_required
    // (3.24). Pin a newer version that we install via:
    //   sdkmanager "cmake;3.30.5"
    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "3.30.5"
        }
    }
    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
