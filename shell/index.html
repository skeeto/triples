<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Triples</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a1a">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #1a1a1a;
    overscroll-behavior: none;
    /* Pinch yes, pan and double-tap-zoom no. Combined with the
       preventDefault override below, this lets iOS Safari engage compositor
       pinch-recognition (pinch-to-close-tab) while keeping single-finger
       swipes snappy (no pan-vs-tap disambiguation delay). */
    touch-action: pinch-zoom;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
    overflow: hidden;
  }
  #canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: pinch-zoom;
    outline: none;
    border: 0;
    background: #1a1a1a;
  }
  /* Splash overlay. iOS Safari refuses to activate the AudioContext during
     drag gestures, so we need a tap before the game starts. The overlay
     guarantees that first interaction is a tap. */
  #splash {
    position: fixed;
    inset: 0;
    background: #F8F2E5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    cursor: pointer;
    transition: opacity 0.25s ease-out;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  #splash.gone {
    opacity: 0;
    pointer-events: none;
  }
  #splash-title {
    font-weight: 800;
    font-size: 14vmin;
    color: #2A2A2A;
    letter-spacing: 0.02em;
  }
  #splash-hint {
    margin-top: 6vmin;
    font-weight: 500;
    font-size: 4vmin;
    color: #66CCFF;
    letter-spacing: 0.1em;
    text-transform: lowercase;
    animation: splashPulse 1.6s ease-in-out infinite;
  }
  @keyframes splashPulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.55; }
  }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="splash">
  <div id="splash-title">Triples</div>
  <div id="splash-hint">tap to play</div>
</div>
<script>
  (function () {
    // Globally neutralize preventDefault() for touch pointer events and
    // touch events. SDL3's Emscripten wrapper calls e.preventDefault() on
    // pointer events (its callback returns EM_TRUE), which blocks iOS
    // Safari from engaging compositor-level pinch recognition on the page.
    // Monkey-patching Event.prototype catches ALL call sites — per-event
    // overrides don't, because the Emscripten wrapper may invoke the
    // prototype method directly. Must run BEFORE the Emscripten loader is
    // evaluated so SDL3 sees the patched version.
    var origPreventDefault = Event.prototype.preventDefault;
    Event.prototype.preventDefault = function () {
      if (this.pointerType === 'touch') return;       // PointerEvent (touch)
      if (this.touches !== undefined) return;          // TouchEvent
      return origPreventDefault.call(this);
    };
    const canvas = document.getElementById('canvas');
    function sync() {
      const dpr = window.devicePixelRatio || 1;
      const w = window.innerWidth, h = window.innerHeight;
      canvas.width  = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
    }
    sync();
    window.addEventListener('resize', sync);
    // The preventDefault monkey-patch lets the browser engage compositor
    // pinch, but SDL3 still receives the first single-finger pointerdown and
    // starts a swipe drag. When a second finger lands we need to (a) cancel
    // that in-progress drag so the tiles don't slide during the pinch and
    // (b) keep SDL3 from seeing any further events in this gesture, so the
    // second finger isn't treated as a fresh tap.
    var activeTouchPointers = new Set();
    var multiTouchActive = false;
    function multiTouchFilter(e) {
      if (e.pointerType !== 'touch') return;
      if (e.type === 'pointerdown') {
        activeTouchPointers.add(e.pointerId);
        if (activeTouchPointers.size >= 2 && !multiTouchActive) {
          // First moment we see two fingers — cancel any in-flight drag.
          // We dispatch the cancels BEFORE flipping multiTouchActive, so
          // this listener re-entering for the synthetic events lets them
          // propagate through to SDL3.
          activeTouchPointers.forEach(function (id) {
            if (id !== e.pointerId) {
              canvas.dispatchEvent(new PointerEvent('pointercancel', {
                pointerId: id, pointerType: 'touch',
                bubbles: true, cancelable: true,
              }));
            }
          });
          multiTouchActive = true;
        }
        if (multiTouchActive) e.stopImmediatePropagation();
        return;
      }
      if (e.type === 'pointermove') {
        if (multiTouchActive) e.stopImmediatePropagation();
        return;
      }
      if (e.type === 'pointerup' || e.type === 'pointercancel') {
        activeTouchPointers.delete(e.pointerId);
        if (multiTouchActive) {
          e.stopImmediatePropagation();
          if (activeTouchPointers.size === 0) multiTouchActive = false;
        }
        return;
      }
    }
    ['pointerdown', 'pointermove', 'pointerup', 'pointercancel'].forEach(function (t) {
      window.addEventListener(t, multiTouchFilter, {capture: true});
    });

    // Audio unlock. Browser autoplay policy keeps an AudioContext suspended
    // unless it was created — or resumed — within a real user-gesture stack
    // frame. C++ side normally calls SDL_OpenAudioDevice from
    // try_init_audio_on_first_gesture_ in the main loop, but for touch
    // input that's apparently too far from the original gesture frame on
    // iOS Safari (Firefox / mobile Safari leave the resulting context
    // suspended). Keyboard happens to work because SDL3's keydown path is
    // short enough.
    //
    // Reliable strategy: pre-create Module.SDL3.audioContext from the
    // gesture handler ITSELF, so iOS sees it being constructed in-gesture
    // (and starts it running). SDL3's audio init later checks for an
    // existing Module.SDL3.audioContext and reuses it instead of building
    // its own. We also resume() defensively and play the classic iOS
    // 1-sample silent buffer on the first activation.
    var _audioPrimed = false;
    function unlockAudio() {
      try {
        if (!window.Module) window.Module = {};
        if (!window.Module.SDL3) window.Module.SDL3 = {};
        // Open SDL3's audio device from inside the gesture stack frame so
        // its new AudioContext() runs while iOS-Safari user activation is
        // still in effect.
        if (window.Module._triples_init_audio) {
          window.Module._triples_init_audio();
        }
        var ctx = window.Module.SDL3.audioContext;
        if (!ctx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          ctx = new AC();
          window.Module.SDL3.audioContext = ctx;
        }
        if (ctx.state !== 'running' && typeof ctx.resume === 'function') {
          ctx.resume();
        }
        if (!_audioPrimed) {
          _audioPrimed = true;
          try {
            var buf = ctx.createBuffer(1, 1, ctx.sampleRate || 22050);
            var src = ctx.createBufferSource();
            src.buffer = buf;
            src.connect(ctx.destination);
            if (src.start) src.start(0); else if (src.noteOn) src.noteOn(0);
          } catch (e) {}
        }
      } catch (e) {}
    }
    // Only register on events that grant the full user activation needed
    // to *resume* an AudioContext on iOS Safari. The HTML spec lists these
    // as "activation triggering input events"; pointerdown and touchstart
    // are notably absent — they create the context but can't transition it
    // from suspended → running. iOS Safari is additionally stricter for
    // drag-style gestures (touchmove between touchstart and touchend), where
    // even touchend doesn't unlock — hence the splash below.
    ['pointerup', 'touchend', 'mouseup', 'keydown', 'click'].forEach(function (t) {
      window.addEventListener(t, unlockAudio, true);
      document.addEventListener(t, unlockAudio, true);
    });

    // Tap-to-play splash. Dismissed by any activation gesture (tap, click,
    // or key press), which is also what unlocks the AudioContext.
    var splashEl = document.getElementById('splash');
    var splashDismissed = false;
    function dismissSplash(e) {
      if (splashDismissed) return;
      splashDismissed = true;
      unlockAudio(e);
      splashEl.classList.add('gone');
      setTimeout(function () {
        if (splashEl.parentNode) splashEl.parentNode.removeChild(splashEl);
      }, 300);
    }
    ['pointerup', 'click'].forEach(function (t) {
      splashEl.addEventListener(t, dismissSplash, true);
    });
    window.addEventListener('keydown', dismissSplash, true);
    // Expose for debugging.
    window._unlockAudio = unlockAudio;
    window._audioState = function () {
      var ctx = window.Module && window.Module.SDL3 && window.Module.SDL3.audioContext;
      return ctx ? {state: ctx.state, sampleRate: ctx.sampleRate, primed: _audioPrimed} : null;
    };

    window.Module = {
      canvas: canvas,
      print: function (m) { console.log(m); },
      printErr: function (m) { console.warn(m); },
    };
  })();
</script>
{{{ SCRIPT }}}
</body>
</html>
