<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Triples</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a1a">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #1a1a1a;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
    overflow: hidden;
  }
  #canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    outline: none;
    border: 0;
    background: #1a1a1a;
  }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<script>
  (function () {
    const canvas = document.getElementById('canvas');
    function sync() {
      const dpr = window.devicePixelRatio || 1;
      const w = window.innerWidth, h = window.innerHeight;
      canvas.width  = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
    }
    sync();
    window.addEventListener('resize', sync);
    canvas.addEventListener('touchstart',  e => e.preventDefault(), {passive: false});
    canvas.addEventListener('touchmove',   e => e.preventDefault(), {passive: false});
    canvas.addEventListener('touchend',    e => e.preventDefault(), {passive: false});
    canvas.addEventListener('gesturestart', e => e.preventDefault());

    // Browser autoplay policy keeps SDL3's AudioContext suspended until a
    // user gesture lets us resume it from a real event-handler frame. SDL3
    // stashes the context at Module.SDL3.audioContext.
    //
    // Strategy: on every gesture, resume() the context AND play a 1-sample
    // silent buffer through the destination. The silent-buffer trick is the
    // historic iOS Safari unlock, but Firefox and Chrome are happy with it
    // too — at worst it's a no-op. Listeners are non-passive in capture phase
    // and attached to both window and document so they fire before any
    // canvas-level SDL3 handler that might stopPropagation().
    var _audioPrimed = false;
    function unlockAudio() {
      try {
        var ctx = window.Module && window.Module.SDL3 && window.Module.SDL3.audioContext;
        if (!ctx) return;
        if (ctx.state !== 'running' && typeof ctx.resume === 'function') {
          ctx.resume();
        }
        if (!_audioPrimed) {
          _audioPrimed = true;
          try {
            var buf = ctx.createBuffer(1, 1, ctx.sampleRate || 22050);
            var src = ctx.createBufferSource();
            src.buffer = buf;
            src.connect(ctx.destination);
            if (src.start) src.start(0); else if (src.noteOn) src.noteOn(0);
          } catch (e) {}
        }
      } catch (e) {}
    }
    ['pointerdown', 'touchstart', 'mousedown', 'keydown', 'click'].forEach(function (t) {
      window.addEventListener(t, unlockAudio, true);
      document.addEventListener(t, unlockAudio, true);
    });
    // Expose for debugging.
    window._unlockAudio = unlockAudio;
    window._audioState = function () {
      var ctx = window.Module && window.Module.SDL3 && window.Module.SDL3.audioContext;
      return ctx ? {state: ctx.state, sampleRate: ctx.sampleRate, primed: _audioPrimed} : null;
    };

    window.Module = {
      canvas: canvas,
      print: function (m) { console.log(m); },
      printErr: function (m) { console.warn(m); },
    };
  })();
</script>

</body>
</html>
