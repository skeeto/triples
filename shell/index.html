<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Triples</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a1a">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #1a1a1a;
    overscroll-behavior: none;
    /* Pinch yes, pan and double-tap-zoom no. Combined with the
       preventDefault override below, this lets iOS Safari engage compositor
       pinch-recognition (pinch-to-close-tab) while keeping single-finger
       swipes snappy (no pan-vs-tap disambiguation delay). */
    touch-action: pinch-zoom;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
    overflow: hidden;
  }
  #canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: pinch-zoom;
    outline: none;
    border: 0;
    background: #1a1a1a;
  }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<script>
  (function () {
    // Globally neutralize preventDefault() for touch pointer events and
    // touch events. SDL3's Emscripten wrapper calls e.preventDefault() on
    // pointer events (its callback returns EM_TRUE), which blocks iOS
    // Safari from engaging compositor-level pinch recognition on the page.
    // Monkey-patching Event.prototype catches ALL call sites — per-event
    // overrides don't, because the Emscripten wrapper may invoke the
    // prototype method directly. Must run BEFORE the Emscripten loader is
    // evaluated so SDL3 sees the patched version.
    var origPreventDefault = Event.prototype.preventDefault;
    Event.prototype.preventDefault = function () {
      if (this.pointerType === 'touch') return;       // PointerEvent (touch)
      if (this.touches !== undefined) return;          // TouchEvent
      return origPreventDefault.call(this);
    };
    const canvas = document.getElementById('canvas');
    function sync() {
      const dpr = window.devicePixelRatio || 1;
      const w = window.innerWidth, h = window.innerHeight;
      canvas.width  = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
    }
    sync();
    window.addEventListener('resize', sync);
    // The preventDefault monkey-patch lets the browser engage compositor
    // pinch, but SDL3 still receives the first single-finger pointerdown and
    // starts a swipe drag. When a second finger lands we need to (a) cancel
    // that in-progress drag so the tiles don't slide during the pinch and
    // (b) keep SDL3 from seeing any further events in this gesture, so the
    // second finger isn't treated as a fresh tap.
    var activeTouchPointers = new Set();
    var multiTouchActive = false;
    function multiTouchFilter(e) {
      if (e.pointerType !== 'touch') return;
      if (e.type === 'pointerdown') {
        activeTouchPointers.add(e.pointerId);
        if (activeTouchPointers.size >= 2 && !multiTouchActive) {
          // First moment we see two fingers — cancel any in-flight drag.
          // We dispatch the cancels BEFORE flipping multiTouchActive, so
          // this listener re-entering for the synthetic events lets them
          // propagate through to SDL3.
          activeTouchPointers.forEach(function (id) {
            if (id !== e.pointerId) {
              canvas.dispatchEvent(new PointerEvent('pointercancel', {
                pointerId: id, pointerType: 'touch',
                bubbles: true, cancelable: true,
              }));
            }
          });
          multiTouchActive = true;
        }
        if (multiTouchActive) e.stopImmediatePropagation();
        return;
      }
      if (e.type === 'pointermove') {
        if (multiTouchActive) e.stopImmediatePropagation();
        return;
      }
      if (e.type === 'pointerup' || e.type === 'pointercancel') {
        activeTouchPointers.delete(e.pointerId);
        if (multiTouchActive) {
          e.stopImmediatePropagation();
          if (activeTouchPointers.size === 0) multiTouchActive = false;
        }
        return;
      }
    }
    ['pointerdown', 'pointermove', 'pointerup', 'pointercancel'].forEach(function (t) {
      window.addEventListener(t, multiTouchFilter, {capture: true});
    });

    // Browser autoplay policy keeps SDL3's AudioContext suspended until a
    // user gesture lets us resume it from a real event-handler frame. SDL3
    // stashes the context at Module.SDL3.audioContext.
    //
    // Strategy: on every gesture, resume() the context AND play a 1-sample
    // silent buffer through the destination. The silent-buffer trick is the
    // historic iOS Safari unlock, but Firefox and Chrome are happy with it
    // too — at worst it's a no-op. Listeners are non-passive in capture phase
    // and attached to both window and document so they fire before any
    // canvas-level SDL3 handler that might stopPropagation().
    var _audioPrimed = false;
    function unlockAudio() {
      try {
        var ctx = window.Module && window.Module.SDL3 && window.Module.SDL3.audioContext;
        if (!ctx) return;
        if (ctx.state !== 'running' && typeof ctx.resume === 'function') {
          ctx.resume();
        }
        if (!_audioPrimed) {
          _audioPrimed = true;
          try {
            var buf = ctx.createBuffer(1, 1, ctx.sampleRate || 22050);
            var src = ctx.createBufferSource();
            src.buffer = buf;
            src.connect(ctx.destination);
            if (src.start) src.start(0); else if (src.noteOn) src.noteOn(0);
          } catch (e) {}
        }
      } catch (e) {}
    }
    ['pointerdown', 'touchstart', 'mousedown', 'keydown', 'click'].forEach(function (t) {
      window.addEventListener(t, unlockAudio, true);
      document.addEventListener(t, unlockAudio, true);
    });
    // Expose for debugging.
    window._unlockAudio = unlockAudio;
    window._audioState = function () {
      var ctx = window.Module && window.Module.SDL3 && window.Module.SDL3.audioContext;
      return ctx ? {state: ctx.state, sampleRate: ctx.sampleRate, primed: _audioPrimed} : null;
    };

    window.Module = {
      canvas: canvas,
      print: function (m) { console.log(m); },
      printErr: function (m) { console.warn(m); },
    };
  })();
</script>
{{{ SCRIPT }}}
</body>
</html>
